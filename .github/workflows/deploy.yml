name: Deploy to Hostinger

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY_PROD }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 153.92.8.220 >> ~/.ssh/known_hosts
          sh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa u153231468@153.92.8.220 'cd  /home/u153231468/domains/osborn.id/public_html/laravel/e-catalog && git pull origin production && composer2 install --no-dev'
