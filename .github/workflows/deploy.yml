name: FTP Deploy

on:
    push:
        branches:
            - dev # ganti sesuai branch kamu

jobs:
    ftp-deploy:
        name: Deploy via FTP
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: FTP Deploy
              uses: SamKirkland/FTP-Deploy-Action@v4
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  server-dir: /public_html/e-catalog/ # sesuaikan dengan folder tujuan kamu
